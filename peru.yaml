# Conventions taken from app-tooling; see
# docs/app-tooling/pattern-imports/README.md.
imports:
    app-tooling|pattern-imports: ./
    app-tooling|pattern-imports-docs: docs/app-tooling/pattern-imports/
    app-tooling|git-commit-stamp: ./
    app-tooling|git-commit-stamp-docs: docs/app-tooling/git-commit-stamp/
    app-tooling|build-warnings: ./
    app-tooling|build-warnings-docs: docs/app-tooling/build-warnings/
    app-tooling|command-inbox: ./
    app-tooling|command-inbox-docs: docs/app-tooling/command-inbox/

git module app-tooling:
    url: https://github.com/tikitu/app-tooling
    reup: v0.6.0
    rev: 63135a84006c4c7cd02d8118667818a89b2ae068

rule pattern-imports:
    export: patterns/pattern-imports/files
rule pattern-imports-docs:
    pick: [patterns/pattern-imports/README.md, patterns/pattern-imports/apply.md, patterns/pattern-imports/CHANGELOG.md]
    export: patterns/pattern-imports

rule git-commit-stamp:
    export: patterns/git-commit-stamp/files
rule git-commit-stamp-docs:
    pick: [patterns/git-commit-stamp/README.md, patterns/git-commit-stamp/apply.md, patterns/git-commit-stamp/CHANGELOG.md]
    export: patterns/git-commit-stamp

rule build-warnings:
    export: patterns/build-warnings/files
rule build-warnings-docs:
    pick: [patterns/build-warnings/README.md, patterns/build-warnings/apply.md, patterns/build-warnings/CHANGELOG.md]
    export: patterns/build-warnings

rule command-inbox:
    export: patterns/command-inbox/files
rule command-inbox-docs:
    pick: [patterns/command-inbox/README.md, patterns/command-inbox/apply.md, patterns/command-inbox/CHANGELOG.md, patterns/command-inbox/guide.md]
    export: patterns/command-inbox
